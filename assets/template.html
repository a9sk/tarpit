<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>{TITLE} | {UPTITLE}</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='{CSSLINK}.css'>
    <!-- <script src='main.js'></script> -->
    <meta property="og:image" content="{PIC}.png">
</head>
<body>
    <div id="content">
        <nav id="{WORD}">
            <a href="{HOME}">Home</a> |
            <a href="{UP}">Back</a> |
            <a href="{OVER}">{NEWTITLE}</a> |
            <a href="{OVER}">{NEWTITLE}</a> |
            <a href="{LINK}">{NEWTITLE}</a> |
            <a href="{LINK}">{NEWTITLE}</a> |
            <a href="{LINK}">{NEWTITLE}</a> |
            <a href="{LINK}">{NEWTITLE}</a> |
            <a href="{LINK}">{NEWTITLE}</a>
        </nav>

        <header>
            <h1 id="article-title">{TITLE}</h1>
        </header>

        <figure>
            <video autoplay loop muted playsinline poster="{PIC}.jpg" title="{SENTENCE}">
                <source src="{PIC}.mp4" type="video/mp4">
            </video>
            <figcaption>{SENTENCE}</figcaption>
        </figure>

        <main>
            {MAIN}
            <p>--</p>
        </main>

        <p>Written by Emiliano Rizzonelli</p>
        <img id="author-profile" src="{PIC}.png" alt="{SENTENCE}">

        <footer id="{WORD}">
            <h2>Other Posts:</h2>
            <div>
                <a href="{LINK}">{NEWTITLE}</a>
                <a href="{LINK}">{NEWTITLE}</a>
                <a href="{LINK}">{NEWTITLE}</a>
                <a href="{LINK}">{NEWTITLE}</a>
                <a href="{LINK}">{NEWTITLE}</a>
            </div>
        </footer>
    </div>
</body>
</html>
